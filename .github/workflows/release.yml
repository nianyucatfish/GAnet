name: Build GAnet Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ganet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows sidecar and source component checks
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sidecar/ganet/go.mod
          cache-dependency-path: sidecar/ganet/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" == v* ]] || {
              echo "Release tag must start with v" >&2
              exit 1
            }
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Release tag must be v<major>.<minor>.<patch>" >&2
              exit 1
            }
            RELEASE=true
          else
            VERSION="0.0.0.dev${GITHUB_RUN_NUMBER}"
            RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Test Python component
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests sidecar/ganet/network_component_test.py -q

      - name: Test Go sidecar
        working-directory: sidecar/ganet
        run: go test ./...

      - name: Build Windows sidecar
        working-directory: sidecar/ganet
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" \
            -o "../../artifacts/ganet-sidecar-windows-amd64-${VERSION}.exe" .
          ../../artifacts/ganet-sidecar-windows-amd64-${VERSION}.exe version > ../../artifacts/sidecar-version.json

      - name: Build macOS sidecars (cross-compiled, no cgo)
        working-directory: sidecar/ganet
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" \
              -o "../../artifacts/ganet-sidecar-darwin-${arch}-${VERSION}" .
          done

      - name: Sign macOS sidecars with the stable GAnet identity
        # Not a trust signature: macOS TCC keys permissions (screen recording)
        # on the code requirement, and an ad-hoc signature changes with every
        # build. Signing every release with the same self-signed certificate
        # gives `identifier "ai.gaagent.ganet-sidecar" and certificate leaf = H"..."`,
        # so a permission granted once survives upgrades. See CODE_SIGNING_POLICY.md.
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          GANET_MACOS_SIGNING_PEM: ${{ secrets.GANET_MACOS_SIGNING_PEM }}
          CODESIGN_TOOL_VERSION: "0.29.0"
          CODESIGN_TOOL_SHA256: "54bb500e2da7a8de02fcae0f331d1cac6e6d7173b4281042ff9c528ba3159aaa"
        run: |
          set -euo pipefail
          if [[ -z "${GANET_MACOS_SIGNING_PEM}" ]]; then
            echo "GANET_MACOS_SIGNING_PEM secret is missing; macOS sidecars would carry an unstable ad-hoc identity" >&2
            exit 1
          fi
          archive="apple-codesign-${CODESIGN_TOOL_VERSION}-x86_64-pc-windows-msvc.zip"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${CODESIGN_TOOL_VERSION}/${archive}"
          echo "${CODESIGN_TOOL_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          unzip -q -o "${RUNNER_TEMP}/${archive}" -d "${RUNNER_TEMP}/rcodesign"
          SIGNER=$(find "${RUNNER_TEMP}/rcodesign" -name rcodesign.exe | head -1)
          umask 077
          printf '%s\n' "${GANET_MACOS_SIGNING_PEM}" > "${RUNNER_TEMP}/ganet-macos-signing.pem"
          for arch in arm64 amd64; do
            unsigned="artifacts/ganet-sidecar-darwin-${arch}-${VERSION}"
            # In-place signing is unreliable on Windows; sign to a new file and swap.
            # No RFC 3161 timestamp: TCC identity matching does not use it, and
            # Apple's timestamp service must not be able to fail a release.
            "${SIGNER}" sign --pem-file "${RUNNER_TEMP}/ganet-macos-signing.pem" \
              --binary-identifier ai.gaagent.ganet-sidecar --timestamp-url none \
              "${unsigned}" "${unsigned}.signed"
            mv -f "${unsigned}.signed" "${unsigned}"
            info=$("${SIGNER}" print-signature-info "${unsigned}")
            grep -q 'identifier: ai.gaagent.ganet-sidecar' <<<"${info}" || { echo "macOS ${arch} sidecar lacks the GAnet identifier" >&2; exit 1; }
            grep -q 'certificate root = H"' <<<"${info}" || { echo "macOS ${arch} sidecar lacks the certificate-bound requirement" >&2; exit 1; }
          done
          rm -f "${RUNNER_TEMP}/ganet-macos-signing.pem"

      - name: Verify source component layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inspection = python -m ganet inspect-component --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $inspection.ok -or `
              $inspection.layout -ne "source" -or `
              $inspection.packageRoot -ne (Resolve-Path $PWD).Path) {
            throw "GAnet source component inspection failed"
          }

      - name: Generate checksums and provenance
        shell: pwsh
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "artifacts/out" | Out-Null
          Copy-Item "artifacts/ganet-sidecar-windows-amd64-$env:VERSION.exe" artifacts/out/
          Copy-Item "artifacts/ganet-sidecar-darwin-arm64-$env:VERSION" artifacts/out/
          Copy-Item "artifacts/ganet-sidecar-darwin-amd64-$env:VERSION" artifacts/out/
          Copy-Item "artifacts/sidecar-version.json" artifacts/out/
          $files = Get-ChildItem artifacts/out -File | Sort-Object Name
          if ($files.Count -ne 4) { throw "Unexpected release artifact set before metadata generation" }
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllText(
            (Join-Path $PWD "artifacts/out/SHA256SUMS.txt"),
            (($checksums -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          @{
            schema = 1
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            version = $env:VERSION
            workflow_run = $env:GITHUB_RUN_ID
            artifacts = $files.Name
          } | ConvertTo-Json -Depth 4 | ForEach-Object {
            [IO.File]::WriteAllText(
              (Join-Path $PWD "artifacts/out/provenance.json"),
              ($_ + "`n"),
              [Text.UTF8Encoding]::new($false)
            )
          }

      - name: Verify release artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $sidecar = "artifacts/out/ganet-sidecar-windows-amd64-$env:VERSION.exe"
          foreach ($required in @($sidecar,
              "artifacts/out/ganet-sidecar-darwin-arm64-$env:VERSION",
              "artifacts/out/ganet-sidecar-darwin-amd64-$env:VERSION")) {
            if (-not (Test-Path $required)) { throw "Required release artifact is missing: $required" }
          }
          $identity = & $sidecar version | ConvertFrom-Json
          if ($identity.version -ne $env:VERSION -or $identity.commit -ne $env:GITHUB_SHA -or `
              $identity.protocolVersion -ne "1") {
            throw "Sidecar build identity does not match the workflow run"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: GAnet-Windows-${{ steps.identity.outputs.version }}
          path: artifacts/out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ steps.identity.outputs.release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "Release tag must point to a commit on main" >&2
            exit 1
          }
          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          GAnet ${VERSION}

          - Auditable tsnet sidecar with embedded SSH/SFTP: Windows amd64, macOS arm64 and amd64
          - macOS binaries carry the stable GAnet code identity (self-signed, not a trust signature) so granted permissions survive upgrades
          - SHA-256 checksums and build provenance

          The GAnet Python component is distributed as source: clone this repository with git and run it under the bound GenericAgent Python. The server mirror imports only published, non-draft, non-prerelease releases and signs its own sidecar manifest. Verify downloaded files against \`SHA256SUMS.txt\`.
          EOF
          gh release create "${GITHUB_REF_NAME}" artifacts/out/* \
            --verify-tag --title "GAnet ${VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md"
