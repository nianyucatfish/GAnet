/* 令牌与样式复刻自官方 GAndroid app.css（墨黑单色·发丝描边·大圆角） */
:root{color-scheme:light;
  --primary-container:#e8e8ed;--bg:#fff;--surface:#fff;--surface2:#ededf0;--surface3:#f2f2f4;
  --txt:#1d1d1f;--txt2:#6e6e73;--mut:#b8b8bd;--line:#e6e6ea;
  --acc:#1d1d1f;--onAcc:#fff;--err:#d70015;--ok:#2ba24e;--elev-1:0 1px 2px rgba(0,0,0,.04)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;
  --primary-container:#2a2a2c;--bg:#0a0a0a;--surface:#161616;--surface2:#262626;--surface3:#1f1f1f;
  --txt:#f5f5f7;--txt2:#a1a1a6;--mut:#48484a;--line:#2c2c2e;
  --acc:#f5f5f7;--onAcc:#1d1d1f;--err:#ff453a;--ok:#32d74b;--elev-1:0 0 0 1px rgba(255,255,255,.04),0 1px 2px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;
  background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
.authCard{width:min(400px,100%);border:1px solid var(--line);border-radius:28px;padding:28px 24px 22px;
  background:var(--surface);box-shadow:0 24px 80px rgba(0,0,0,.38),0 2px 8px rgba(0,0,0,.12);
  animation:authCardIn .42s cubic-bezier(.22,1,.36,1)}
@keyframes authCardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.authLogo{display:flex;justify-content:center;margin-bottom:18px}
.gaLogo{width:48px;height:48px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;
  padding-top:7px;font-family:'GA Azonix',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:400;font-size:20px;letter-spacing:.02em;line-height:1;color:var(--bg);background:var(--txt);box-shadow:var(--elev-1)}
.authTitle{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15;text-align:center;margin-bottom:7px}
.authSub{color:var(--mut);font-size:14px;line-height:1.5;text-align:center;margin-bottom:22px;padding:0 6px}
.authSeg{display:flex;gap:4px;margin:2px 0 18px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px}
.authSeg .segBtn{flex:1;height:38px;border:none;border-radius:10px;background:transparent;color:var(--mut);font-size:15px;font-weight:700;cursor:pointer;transition:.16s}
.authSeg .segBtn.on{background:var(--acc);color:var(--onAcc)}
.authField{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.authField label{font-size:13px;color:var(--mut);font-weight:600}
.codeField input.plain{letter-spacing:normal}
.codeField{display:flex;align-items:center;height:50px;border:1px solid var(--line);border-radius:15px;padding:0 6px 0 15px;background:var(--surface2);transition:border-color .18s,box-shadow .18s,background .18s}
.codeField:focus-within{border-color:var(--txt);background:var(--surface);box-shadow:0 0 0 4px var(--primary-container)}
.codeField input{flex:1;min-width:0;height:100%;border:none;background:transparent;color:var(--txt);font-size:16px;letter-spacing:.12em;outline:none;-webkit-appearance:none}
.codeField input::placeholder{color:var(--mut);opacity:.7;letter-spacing:normal}
.codeDiv{flex:none;width:1px;height:22px;background:var(--line);margin:0 4px 0 8px}
.codeSend{flex:none;border:none;background:transparent;color:var(--acc);font-size:14px;font-weight:600;white-space:nowrap;padding:0 10px;height:38px;border-radius:10px;cursor:pointer}
.codeSend:disabled{color:var(--mut);cursor:default;opacity:.85}
.authForgot{text-align:right;margin:-2px 15px 14px;height:18px;line-height:18px;overflow:hidden}
.authForgot a{color:var(--acc);font-size:13px;cursor:pointer;text-decoration:none}
.authAux{text-align:center;margin-top:12px;min-height:20px;line-height:20px}
.authAux a{color:var(--acc);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.authAux .hint{color:var(--mut);font-size:12px}
.authBtn{display:block;width:100%;height:50px;border:none;border-radius:15px;padding:0 16px;background:var(--acc);color:var(--onAcc);font-weight:800;font-size:16px;cursor:pointer;transition:opacity .18s,transform .1s,filter .18s;-webkit-appearance:none}
.authBtn:not(:disabled):active{transform:scale(.985);filter:brightness(.94)}
.authBtn:disabled{opacity:.5;cursor:default}
.authErr{min-height:0;margin-top:9px;color:var(--err);font-size:13px;text-align:center;line-height:1.4}
.authErr.ok{color:var(--ok)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:btnspin .6s linear infinite;vertical-align:middle}
@keyframes btnspin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="authCard">
  <div class="authLogo"><span class="gaLogo">GA</span></div>
  <div class="authTitle">__APP__</div>
  <div class="authSub">登录你的账号以接入电脑端</div>
  <div id="body"></div>
</div>
<script>
const BASE="__BASE__",STATE="__STATE__",$=id=>document.getElementById(id);
let screen="login",byCode=false,email="";        // screen: login|register|forgot; byCode: 登录用验证码
function vEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||"")}
function say(t,c){var el=$("err");if(el){el.textContent=t||"";el.className="authErr"+(c==="ok"?" ok":"")}}
function busy(b,on){if(!b)return;b.disabled=on;if(on){b.dataset.t=b.innerHTML;b.innerHTML='<span class="spin"></span>'}
  else if(b.dataset.t!=null){b.innerHTML=b.dataset.t;delete b.dataset.t}}
async function post(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b)});let d={};try{d=await r.json()}catch(e){}return{ok:r.ok,d}}
function fEmail(){return '<div class="authField"><label>邮箱</label><div class="codeField"><input id="email" class="plain" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com"></div></div>'}
function fCode(){return '<div class="authField"><label>验证码</label><div class="codeField"><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码"><span class="codeDiv"></span><button type="button" id="send" class="codeSend">发送验证码</button></div></div>'}
function fPwd(lbl,ph){return '<div class="authField"><label>'+lbl+'</label><div class="codeField"><input id="pwd" class="plain" type="password" autocomplete="current-password" placeholder="'+ph+'"></div></div>'}
function render(){
  var showCode=screen==="register"||screen==="forgot"||(screen==="login"&&byCode),html="";
  if(screen!=="forgot")
    html+='<div class="authSeg"><button class="segBtn'+(screen==="login"?" on":"")+'" data-s="login">登录</button>'
        +'<button class="segBtn'+(screen==="register"?" on":"")+'" data-s="register">注册</button></div>';
  html+=fEmail();
  if(screen==="forgot"){
    html+=fCode()+fPwd("新密码","设置新密码（≥8 位）")
      +'<button id="primary" class="authBtn">重置并登录</button><div class="authErr" id="err"></div>'
      +'<div class="authAux"><a id="back">返回登录</a></div>';
  }else{
    html+=(showCode?fCode():fPwd("密码","密码（≥8 位）"));
    // 忘记密码行在登录/注册各态都占位, 仅"登录+密码"显示链接 → 切换方式时字段/按钮不跳
    html+='<div class="authForgot">'+((screen==="login"&&!byCode)?'<a id="forgot">忘记密码？</a>':'')+'</div>';
    html+='<button id="primary" class="authBtn">'+(screen==="register"?"注册并登录":"登录")+'</button>';
    html+='<div class="authErr" id="err"></div>';
    html+='<div class="authAux">'+(screen==="register"
        ?'<span class="hint">未注册的邮箱将自动创建账号</span>'
        :'<a id="method">'+(byCode?"使用密码登录":"使用验证码登录")+'</a>')+'</div>';
  }
  $("body").innerHTML=html;wire();
}
function wire(){
  var e=$("email");if(e){e.value=email;e.oninput=function(){email=(e.value||"").trim().toLowerCase()}}
  document.querySelectorAll(".segBtn").forEach(function(b){b.onclick=function(){screen=b.getAttribute("data-s");byCode=false;render()}});
  var m=$("method");if(m)m.onclick=function(){byCode=!byCode;render()};
  var f=$("forgot");if(f)f.onclick=function(){screen="forgot";render()};
  var bk=$("back");if(bk)bk.onclick=function(){screen="login";byCode=false;render()};
  var s=$("send");if(s)s.onclick=sendCode;
  var c=$("code");if(c)c.addEventListener("keydown",function(ev){if(ev.key==="Enter")submit()});
  var p=$("pwd");if(p)p.addEventListener("keydown",function(ev){if(ev.key==="Enter")submit()});
  $("primary").onclick=submit;
}
async function sendCode(){
  if(!vEmail(email)){say("邮箱格式不正确");return}
  var s=$("send");busy(s,true);say("");
  var r=await post(BASE+"/auth/send_code",{email});busy(s,false);
  if(!r.ok){say((r.d&&r.d.detail)||"发送失败");return}
  say("验证码已发送，请查收","ok");try{$("code").focus()}catch(e){}
}
async function submit(){
  if(!vEmail(email)){say("邮箱格式不正确");return}
  var path,payload;
  if(screen==="forgot"){
    var cd=($("code").value||"").trim(),pw=$("pwd").value||"";
    if(!/^\d{6}$/.test(cd)){say("请输入 6 位验证码");return}
    if(pw.length<8){say("密码至少 8 位");return}
    path="/auth/reset_password";payload={email,code:cd,password:pw};
  }else if(screen==="register"||byCode){
    var c2=($("code").value||"").trim();
    if(!/^\d{6}$/.test(c2)){say("请输入 6 位验证码");return}
    path="/auth/verify";payload={email,code:c2};             // 新邮箱自动建号(注册), 已有则登录
  }else{
    var p2=$("pwd").value||"";
    if(p2.length<8){say("密码至少 8 位");return}
    path="/auth/login_password";payload={email,password:p2};
  }
  var b=$("primary");busy(b,true);say("");
  var r=await post(BASE+path,payload);
  if(!r.ok||!r.d.token){busy(b,false);say((r.d&&r.d.detail)||"登录失败");return}
  var cb=await post("/callback",{state:STATE,token:r.d.token,userId:r.d.userId,email:r.d.email,
    nickname:r.d.nickname,hasPassword:r.d.hasPassword,isNew:r.d.isNew});
  busy(b,false);b.textContent="已登录 ✓";                 // 停转圈, 置成功态(勿留 spinner)
  if(cb.d&&cb.d.next){say("✓ 登录成功，正在打开用户中心…","ok");location.replace(cb.d.next);return}
  say("✓ 登录成功，可关闭此页返回终端","ok");
  document.querySelectorAll("input,button,a").forEach(function(x){x.disabled=true;x.style.pointerEvents="none"});
}
render();
</script></body></html>
