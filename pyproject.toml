[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ganet"
dynamic = ["version"]
description = "GAnet desktop user center and device interconnect component"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "cryptography>=42",
    "Pillow>=10",
    "qrcode>=7.4",
]

[project.scripts]
ganet = "ganet.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "ganet.__version__" }

[tool.setuptools.packages.find]
include = ["ganet*"]

[tool.setuptools.package-data]
"ganet.device_connection" = ["pages/*.html"]
